[project]
name = "ins-c2-054"
version = "0.1.0"
description = "Insurance Claims Fraud Detection & Investigator Alert Agent — AgentCore Template"
requires-python = ">=3.11"
# The agent framework is not a public-PyPI distribution; it is installed from
# the package registry by CI. Pinning it here would make `pip install -e .`
# fail, because it cannot be resolved from the default index.
#
# pyyaml is a real runtime dependency: the entry point reads config/config.yaml
# at startup to construct the graph with the operator's settings.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published framework distribution ships no typing marker, so every
# framework import resolves to Any — which would make each required framework
# subclass an error on its own. Only that consequence is switched off; the
# remaining strict settings stay on.
disallow_subclassing_any = false
# The sample graphs are reference material for template authors, kept verbatim.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

# State extends the framework's own state TypedDict. Correct at runtime, but
# with the base resolving to Any mypy cannot see the TypedDict and mis-flags
# every field. Silence only that diagnostic, only for that module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
